    <line x1="170" y1="352" x2="170" y2="300" stroke="#0b0f16" stroke-opacity="0.45"/>
    <line x1="256" y1="352" x2="256" y2="244" stroke="#0b0f16" stroke-opacity="0.45"/>
    <line x1="342" y1="352" x2="342" y2="188" stroke="#0b0f16" stroke-opacity="0.45"/>
  </g>
  <g stroke-linecap="round" stroke-width="46">
    <line x1="170" y1="344" x2="170" y2="300" stroke="#e3b341"/>
    <line x1="256" y1="344" x2="256" y2="244" stroke="#ff8c42"/>
    <line x1="342" y1="344" x2="342" y2="188" stroke="#f85149"/>
  </g>
</svg>
